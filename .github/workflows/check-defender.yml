name: Check defender branch

on:
  push:
    branches: [codex/village-defender]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Parse defender FBX with the game's loader
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {FBXLoader} from 'three/examples/jsm/loaders/FBXLoader.js';
          import {Box3,Vector3} from 'three';
          const bytes=fs.readFileSync('public/img/models/Adventurer_Defender_Rigged.fbx');
          const data=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
          const actor=new FBXLoader().parse(data,'');
          const clips=actor.animations;
          const required=['Idle_Sword','Walk','Run','Sword_Slash','HitRecieve','Death'];
          for(const name of required){
            const clip=clips.find(c=>c.name.endsWith(name));
            if(!clip || clip.duration<=0 || !clip.tracks.some(t=>{
              const stride=t.getValueSize(),a=t.values;
              for(let i=stride;i<a.length;i++)if(Math.abs(a[i]-a[i%stride])>1e-4)return true;
              return false;
            }))throw new Error('Missing real animation: '+name);
          }
          let skinned=0;
          actor.traverse(o=>{if(o.isSkinnedMesh)skinned++;});
          const height=new Box3().setFromObject(actor).getSize(new Vector3()).y;
          if(skinned<4||!Number.isFinite(height)||height<=0)throw new Error('Invalid skinned model '+skinned+' '+height);
          console.log('FBX OK:',skinned,'skinned meshes,',clips.length,'clips, height',height);
          JS
