name: Convert defender FBX to GLB

on:
  workflow_dispatch:
  push:
    paths:
      - "public/img/models/Adventurer_Defender_Rigged.fbx"
      - "scripts/convert_defender_blender.py"
      - ".github/workflows/convert-defender.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version | head -n 2

      - name: Convert defender with Blender
        run: |
          blender -b --python scripts/convert_defender_blender.py
          test -s public/img/models/Adventurer_Defender_Rigged.glb
          ls -lh public/img/models/Adventurer_Defender_Rigged.glb

      - name: Inspect GLB
        run: |
          npx --yes @gltf-transform/cli inspect public/img/models/Adventurer_Defender_Rigged.glb

      - name: Commit GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/models/Adventurer_Defender_Rigged.glb
          if git diff --cached --quiet; then
            echo "GLB unchanged"
          else
            git commit -m "Convert defender FBX to GLB with Blender"
            git push
          fi
