name: Inspect Stranger GLB
on:
  push:
    paths:
      - ".github/workflows/inspect-stranger.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read model skeleton animations meshes
        run: |
          node <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('public/img/models/hit2_stranger_mobile.glb');
          if (b.toString('ascii',0,4)!=='glTF')throw new Error('Invalid GLB');
          const jsonLen=b.readUInt32LE(12);
          const gltf=JSON.parse(b.toString('utf8',20,20+jsonLen));
          const nodes=gltf.nodes||[], meshes=gltf.meshes||[], skins=gltf.skins||[];
          const attrs=(m)=>m?.primitives?.map((p)=>{const a=gltf.accessors[p.attributes?.POSITION];return {min:a?.min,max:a?.max,joints:p.attributes?.JOINTS_0!==undefined}})||[];
          console.log('GLB VERSION',gltf.asset?.version,'NODES',nodes.length,'MESHES',meshes.length,'SKINS',skins.length);
          console.log('SCENES',JSON.stringify(gltf.scenes));
          console.log('SKINS',JSON.stringify(skins.map(s=>({name:s.name,skeleton:s.skeleton,joints:s.joints?.map(i=>nodes[i]?.name)}))).slice(0,12000));
          console.log('ANIMATIONS',JSON.stringify((gltf.animations||[]).map(a=>({name:a.name,channels:a.channels?.length,targets:a.channels?.slice(0,30).map(c=>({node:nodes[c.target?.node]?.name,path:c.target?.path}))}))).slice(0,15000));
          console.log('NODES WITH MESHES',JSON.stringify(nodes.map((n,i)=>({i,name:n.name,mesh:n.mesh,skin:n.skin,translation:n.translation,scale:n.scale,rotation:n.rotation,children:n.children?.length,primitives:n.mesh!==undefined?attrs(meshes[n.mesh]):undefined})).filter(n=>n.mesh!==undefined)).slice(0,20000));
          console.log('ROOT NODES',JSON.stringify((gltf.scenes||[]).flatMap(s=>s.nodes||[]).map(i=>({i,node:nodes[i]}))).slice(0,6000));
          console.log('SKELETON BONES',JSON.stringify(nodes.map((n,i)=>({i,name:n.name,children:n.children})).filter(n=>/arm|hand|shoulder|spine|hips|pelvis|thigh|weapon|sword|blade|sheat|holster/i.test(n.name||''))).slice(0,16000));
          NODE
