name: Inspect Wanderer Cape Weights
on:
  push:
    paths:
      - ".github/workflows/inspect-wanderer-cape.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source meshes and cape vertex weights
        run: |
          node <<'NODE'
          const fs=require('fs');
          const data=fs.readFileSync('public/img/models/hit2_stranger_mobile.glb');
          const jn=data.readUInt32LE(12),j=JSON.parse(data.toString('utf8',20,20+jn));
          const bufferStart=20+jn+8;
          const types={5120:1,5121:1,5122:2,5123:2,5125:4,5126:4};
          const components={SCALAR:1,VEC2:2,VEC3:3,VEC4:4,MAT4:16};
          const readAcc=(idx)=>{
            const a=j.accessors[idx],v=j.bufferViews[a.bufferView];
            const n=components[a.type],b=types[a.componentType],stride=v.byteStride||n*b;
            const out=new Float64Array(a.count*n);
            const start=bufferStart+(v.byteOffset||0)+(a.byteOffset||0);
            for(let i=0;i<a.count;i++)for(let k=0;k<n;k++){
              const p=start+i*stride+k*b;
              out[i*n+k]=a.componentType===5126?data.readFloatLE(p):a.componentType===5125?data.readUInt32LE(p):a.componentType===5123?data.readUInt16LE(p):a.componentType===5122?data.readInt16LE(p):a.componentType===5121?data.readUInt8(p):data.readInt8(p);
            }
            return {values:out,n,count:a.count};
          };
          const skin=j.skins[0],caps=skin.joints.map((nd,i)=>({i,name:j.nodes[nd].name})).filter(x=>/cape|wing/i.test(x.name));
          const cset=new Set(caps.map(x=>x.i));
          console.log('CAPEBONES',JSON.stringify(caps));
          console.log('MATERIALS',JSON.stringify((j.materials||[]).map((m,i)=>({i,name:m.name,alphaMode:m.alphaMode}))));
          for (const [mi,m] of j.meshes.entries()){
            console.log('MESH',mi,m.name);
            for (const [pi,p] of m.primitives.entries()){
              const pos=readAcc(p.attributes.POSITION);
              const skinIdx=p.attributes.JOINTS_0===undefined?null:readAcc(p.attributes.JOINTS_0);
              const w=skinIdx&&readAcc(p.attributes.WEIGHTS_0);
              const inds=p.indices!==undefined?readAcc(p.indices).values:null;
              const tris=inds?Math.floor(inds.length/3):Math.floor(pos.count/3);
              let capV=0,capTris=[0,0,0,0],capMin=[Infinity,Infinity,Infinity],capMax=[-Infinity,-Infinity,-Infinity];
              const capeweights=new Float64Array(pos.count);
              if(w)for(let vi=0;vi<pos.count;vi++){
                for(let k=0;k<4;k++){if(cset.has(skinIdx.values[vi*4+k]))capeweights[vi]+=w.values[vi*4+k];}
                if(capeweights[vi]>.5){capV++;for(let k=0;k<3;k++){const value=pos.values[vi*3+k];capMin[k]=Math.min(capMin[k],value);capMax[k]=Math.max(capMax[k],value);}}
              }
              if(w)for(let ti=0;ti<tris;ti++){
                const a=inds?inds[ti*3]:ti*3,b=inds?inds[ti*3+1]:ti*3+1,c=inds?inds[ti*3+2]:ti*3+2;
                const max=Math.max(capeweights[a],capeweights[b],capeweights[c]);
                for(let k=0;k<4;k++)if(max>[.1,.25,.5,.8][k])capTris[k]++;
              }
              console.log('PRIMITIVE',JSON.stringify({mi,pi,material:p.material,attributes:Object.keys(p.attributes),vertices:pos.count,triangles:tris,capeHeavyVertices:capV,capeMaxTriangles:capTris,capeBoundsMin:capMin,capeBoundsMax:capMax}));
            }
          }
          NODE
