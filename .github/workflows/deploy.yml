name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Optimize animated hero for web
        run: |
          npx --yes @gltf-transform/cli resize public/img/models/Vika-3d-animated-optimized.glb public/img/models/Vika-3d-animated-optimized.web.glb --width 1536 --height 1536
          mv public/img/models/Vika-3d-animated-optimized.web.glb public/img/models/Vika-3d-animated-optimized.glb

      - name: Build
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
